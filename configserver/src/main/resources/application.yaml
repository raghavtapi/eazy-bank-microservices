spring:
  application:
    name: "configserver"
  profiles:
    active: git
#    profiles.active should be native when we are using classpath or file system location
#    whereas if we are using a git repo then we should use profiles.active as git
#    active: native
  cloud:
    config:
      server:
        git:
          uri: "https://github.com/raghavtapi/eazy-bank-config.git"
          default-label: master
          timeout: 5
          clone-on-start: true
          force-pull: true

#       server.native should only be used when we have profiles.active as native
#       whereas if we are using a git then we should use server.git
#       native:
#         # This is the way to load configurations using file system location
#         search-locations: "file:///C://Users//RaghavTapi//OneDrive - Gentrack//Desktop//Dev//Docs//Microservices//Udemy - EazyBytes//config//"
##        search-locations: "classpath:/config"

server:
  port: 8071
encrypt:
  key: "45D81EC1EF61DF9AD8D3E5BB397F9"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"