server:
  port: 9000

spring:
  application:
    name: "cards"
  profiles:
    active:
      - "prod"
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
    # This optional tells the cards microservice that even if due to any reason we are not able to connect
    # to config server than also start the cards' microservice. "optional:" is optional here.
    #import: "configserver:http://localhost:8071/"
    import: "optional:configserver:http://localhost:8071/"


# Since we are using config server we don't need these properties on individual microservice level
# These properties can now be found at configserver/src/main/resources/config/cards.yml
#  config:
#    import:
#      - "application_qa.yml"
#      - "application_prod.yml"
#  profiles:
#    active:
#      - "prod"
